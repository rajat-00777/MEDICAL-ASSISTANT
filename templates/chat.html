<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Chatbot</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="page">
    <div class="chat-window">

      <div class="chat-header">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5fcda8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v6M9 6h6M6 12v3a6 6 0 0 0 12 0v-3"/>
            <circle cx="6" cy="10" r="2"/>
            <circle cx="18" cy="10" r="2"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Medcare Assistant</h1>
          <div class="status-row">
            <span class="pulse-dot"></span>
            <span>Online</span>
          </div>
        </div>
        <button id="newChatBtn" class="new_chat_btn" title="Start a new conversation" aria-label="Start a new conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
        <div class="ekg">
          <svg viewBox="0 0 600 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 20 H60 L70 5 L80 35 L90 20 H160 L170 8 L180 32 L190 20 H600
                     M600 20 H660 L670 5 L680 35 L690 20 H760 L770 8 L780 32 L790 20 H1200"
                  fill="none" stroke="#5fcda8" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <div id="messageFormeight" class="chat-body">
        <div id="starterWrap" class="starter-wrap">
          <p class="starter-label">Try asking:</p>
          <div class="starter-chips">
            {% for q in starter_questions %}
              <button type="button" class="chip" data-question="{{ q }}">{{ q }}</button>
            {% endfor %}
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <form id="messageArea" class="input-row">
          <input
            type="text"
            id="text"
            name="msg"
            placeholder="Describe your symptoms or ask a question..."
            autocomplete="off"
            class="type_msg"
            required
          />
          <button type="submit" id="send" class="send_btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13"/>
              <path d="M22 2 15 22 11 13 2 9 22 2Z"/>
            </svg>
          </button>
        </form>
        <div class="disclaimer">Informational only &middot; not a substitute for professional medical advice</div>
      </div>

    </div>
  </div>

  <script>
    const botAvatarSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#5fcda8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v6M9 6h6M6 12v3a6 6 0 0 0 12 0v-3"/>
      <circle cx="6" cy="10" r="2"/><circle cx="18" cy="10" r="2"/>
    </svg>`;
    const userAvatarSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#e3a76f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
    </svg>`;
    const copyIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
    </svg>`;
    const checkIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>`;
    const shareIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/>
    </svg>`;

    const form = document.getElementById('messageArea');
    const input = document.getElementById('text');
    const feed = document.getElementById('messageFormeight');
    const starterWrap = document.getElementById('starterWrap');
    const newChatBtn = document.getElementById('newChatBtn');

    function timeNow(){
      const d = new Date();
      const h = d.getHours().toString().padStart(2,'0');
      const m = d.getMinutes().toString().padStart(2,'0');
      return `${h}:${m}`;
    }

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function hideStarters(){
      if (starterWrap) starterWrap.style.display = 'none';
    }

    // sender: 'bot' or 'user'. sources: optional array of {file, page}
    function addMessage(text, sender, sources){
      const row = document.createElement('div');
      row.className = `row ${sender}`;

      const bodyHtml = sender === 'bot'
        ? marked.parse(text)
        : escapeHtml(text);

      let sourcesHtml = '';
      if (sender === 'bot' && sources && sources.length){
        const items = sources
          .map(s => `${s.file}${s.page ? `, p.${s.page}` : ''}`)
          .join(' &middot; ');
        sourcesHtml = `<div class="msg-sources">Source: ${items}</div>`;
      }

      const actionsHtml = sender === 'bot'
        ? `<div class="msg-actions">
             <button type="button" class="icon_btn copy_btn" title="Copy answer" aria-label="Copy answer">${copyIconSVG}</button>
             <button type="button" class="icon_btn share_btn" title="Share answer" aria-label="Share answer">${shareIconSVG}</button>
           </div>`
        : '';

      row.innerHTML = `
        <div class="avatar ${sender}">${sender === 'bot' ? botAvatarSVG : userAvatarSVG}</div>
        <div class="bubble-wrap">
          <div class="bubble">${bodyHtml}<span class="msg-time">${timeNow()}</span></div>
          ${sourcesHtml}
          ${actionsHtml}
        </div>
      `;
      feed.appendChild(row);
      feed.scrollTop = feed.scrollHeight;

      if (sender === 'bot'){
        const copyBtn = row.querySelector('.copy_btn');
        const shareBtn = row.querySelector('.share_btn');
        copyBtn.addEventListener('click', () => copyAnswer(text, copyBtn));
        shareBtn.addEventListener('click', () => shareAnswer(text));
      }

      return row;
    }

    async function copyAnswer(text, btn){
      try{
        await navigator.clipboard.writeText(text);
      }catch(err){
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const original = btn.innerHTML;
      btn.innerHTML = checkIconSVG;
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = original;
        btn.classList.remove('copied');
      }, 1500);
    }

    async function shareAnswer(text){
      if (navigator.share){
        try{
          await navigator.share({ title: 'Medcare Assistant', text });
        }catch(err){
          // user cancelled share sheet
        }
      }else{
        await navigator.clipboard.writeText(text);
        alert('Sharing isn\'t supported on this browser — answer copied to clipboard instead.');
      }
    }

    function addTyping(){
      const row = document.createElement('div');
      row.className = 'row bot typing';
      row.innerHTML = `
        <div class="avatar bot">${botAvatarSVG}</div>
        <div class="bubble"><span></span><span></span><span></span></div>
      `;
      feed.appendChild(row);
      feed.scrollTop = feed.scrollHeight;
      return row;
    }

    async function sendMessage(msg){
      hideStarters();
      addMessage(msg, 'user');
      const typingRow = addTyping();

      try{
        const params = new URLSearchParams();
        params.append('msg', msg);

        const res = await fetch('/get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        const data = await res.json();
        typingRow.remove();
        addMessage(data.answer, 'bot', data.sources);
      }catch(err){
        typingRow.remove();
        addMessage("Something went wrong reaching the assistant. Please try again.", 'bot');
      }
    }

    form.addEventListener('submit', function(event){
      event.preventDefault();
      const msg = input.value.trim();
      if(!msg) return;
      input.value = '';
      sendMessage(msg);
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => sendMessage(chip.dataset.question));
    });

    newChatBtn.addEventListener('click', async () => {
      try{
        await fetch('/new_chat', { method: 'POST' });
      }catch(err){ /* non-fatal */ }
      feed.innerHTML = '';
      feed.appendChild(starterWrap);
      starterWrap.style.display = '';
    });
  </script>
</body>
</html>
